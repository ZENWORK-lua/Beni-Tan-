<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ali Poyraz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0c140e;          
            --card-bg: #142018;          
            --card-border: #1e3024;      
            --text-cream: #f4efe6;       
            --text-muted: #9ab0a0;       
            --accent-green: #2e5238;     
            --accent-brown: #cfbda8;     
            --accent-brown-hover: #b8a48f;
            --apple-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-cream);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: radial-gradient(circle at 50% 0%, #15261b 0%, var(--bg-main) 70%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Ana Kart - Esneyen Yapı */
        .card {
            width: 100%;
            max-width: 360px; /* İlk aşamada küçük karemsi */
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            position: relative;
            transition: max-width 0.6s var(--apple-ease), padding 0.6s var(--apple-ease);
        }

        /* Genişlemiş Ana Profil Modu */
        .card.expanded {
            max-width: 440px;
        }

        /* Ekranın altından çıkıp yuvarlatılmış kareye dönüşme animasyonu */
        .anim-pop {
            animation: popUp 0.85s var(--apple-ease) forwards;
        }

        @keyframes popUp {
            0% {
                transform: translateY(100vh) scale(0.1);
                border-radius: 50%;
                opacity: 0;
            }
            60% {
                transform: translateY(-8px) scale(1.02);
                border-radius: 36px;
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                border-radius: 28px;
                opacity: 1;
            }
        }

        /* Aşama İçerikleri */
        .content-step {
            transition: opacity 0.35s var(--apple-ease), transform 0.35s var(--apple-ease);
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .fade-in {
            animation: fadeInStep 0.45s var(--apple-ease) forwards;
        }

        @keyframes fadeInStep {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Gizli Eleman */
        .hidden {
            display: none !important;
        }

        /* Karşılama Formu */
        .intro-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .intro-title {
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-cream);
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-field, .textarea-field {
            width: 100%;
            background: rgba(12, 20, 14, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            color: var(--text-cream);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.25s var(--apple-ease);
        }

        .input-field:focus, .textarea-field:focus {
            border-color: var(--accent-brown);
            background: rgba(12, 20, 14, 0.95);
            box-shadow: 0 0 0 3px rgba(207, 189, 168, 0.12);
        }

        /* Poyraz ile tanıştınız mı? Seçenekleri */
        .radio-options {
            display: flex;
            gap: 8px;
        }

        .radio-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(12, 20, 14, 0.5);
            border: 1px solid var(--card-border);
            padding: 10px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--text-muted);
            transition: all 0.25s var(--apple-ease);
            user-select: none;
        }

        .radio-btn.active {
            border-color: var(--accent-brown);
            background: rgba(207, 189, 168, 0.12);
            color: var(--text-cream);
            font-weight: 600;
        }

        /* Profil ve Ana İçerik */
        .profile-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .welcome-badge {
            font-size: 0.85rem;
            color: var(--accent-brown);
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.01em;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-green);
            border: 2px solid var(--accent-brown);
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-cream);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-cream);
        }

        .bio {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.45;
            margin-top: 8px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
        }

        .tag {
            background: rgba(207, 189, 168, 0.08);
            border: 1px solid rgba(207, 189, 168, 0.15);
            color: var(--accent-brown);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: var(--card-border);
            margin: 20px 0;
        }

        /* Mesaj Kutusu */
        .message-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .textarea-field {
            resize: none;
            height: 85px;
        }

        .anon-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(12, 20, 14, 0.4);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(30, 48, 36, 0.5);
            cursor: pointer;
        }

        .anon-text {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e3024;
            transition: .3s var(--apple-ease);
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-cream);
            transition: .3s var(--apple-ease);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-green);
            border: 1px solid var(--accent-brown);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
            background-color: var(--accent-brown);
        }

        .send-btn {
            background: var(--accent-brown);
            color: var(--bg-main);
            border: none;
            border-radius: 14px;
            padding: 13px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s var(--apple-ease);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
        }

        .send-btn:hover {
            background: var(--accent-brown-hover);
            transform: translateY(-1px);
        }

        .send-btn:active {
            transform: scale(0.97);
        }

        .status-msg {
            font-size: 0.78rem;
            text-align: center;
            margin-top: 4px;
            min-height: 16px;
        }

        .status-success { color: #81c784; }
        .status-error { color: #e57373; }
    </style>
</head>
<body>

    <div id="mainCard" class="card">
        
        <!-- SADECE İLK GİRİŞTE GÖZÜKEN KÜÇÜK KARE İÇERİĞİ -->
        <div id="stepIntro" class="content-step">
            <div class="intro-box">
                <h2 class="intro-title">Aramıza Hoş Geldin 👋</h2>
                
                <div class="field-group">
                    <label class="field-label">Sana nasıl hitap edelim? (Zorunlu)</label>
                    <input type="text" id="introName" class="input-field" placeholder="Adını gir..." maxlength="30">
                </div>

                <div class="field-group">
                    <label class="field-label">Poyraz ile daha önce tanıştınız mı?</label>
                    <div class="radio-options">
                        <div class="radio-btn active" onclick="selectRadio(this, 'Evet')">
                            Evet, tanışıyoruz
                        </div>
                        <div class="radio-btn" onclick="selectRadio(this, 'Hayır')">
                            İlk defa görüyorum
                        </div>
                    </div>
                </div>

                <button class="send-btn" onclick="completeIntro()">
                    Devam Et
                </button>
                <div id="introError" class="status-msg status-error"></div>
            </div>
        </div>

        <!-- ANA PROFİL İÇERİĞİ (BAŞLANGIÇTA GİZLİ VEYA TEKRAR GİRİŞTE DİREKT AÇIK) -->
        <div id="stepMain" class="content-step hidden">
            <div class="profile-section">
                <div id="welcomeHeading" class="welcome-badge"></div>
                <div class="avatar">AP</div>
                <h1 class="name">Ali Poyraz</h1>
                <p class="bio">Kod yazmak, kalisteniks, basketbol ve sistem optimizasyonları. Takılmaca.</p>

                <div class="tags-container">
                    <span class="tag">Samsun</span>
                    <span class="tag">Luau & Scripting</span>
                    <span class="tag">Hot Wheels</span>
                    <span class="tag">Linux</span>
                </div>
            </div>

            <div class="divider"></div>

            <div class="message-box">
                <textarea id="userMessage" class="textarea-field" placeholder="Düşüncelerini veya söylemek istediğini yaz..." maxlength="500"></textarea>

                <label class="anon-option">
                    <span class="anon-text">İsmim gizlensin (Anonim Gönder)</span>
                    <div class="switch">
                        <input type="checkbox" id="anonCheck">
                        <span class="slider"></span>
                    </div>
                </label>

                <button class="send-btn" onclick="sendMessage()">
                    Mesajı Gönder
                </button>

                <div id="statusMsg" class="status-msg"></div>
            </div>
        </div>

    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "BURAYA_DISCORD_WEBHOOK_LINKINI_YAPISTIR";
        let metPoyrazValue = "Evet";

        window.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('mainCard');
            const savedName = localStorage.getItem('visitor_name');

            if (savedName) {
                // Daha önce girmişse: Animasyonsuz, direkt genişlemiş kart ve sadece profil içeriği
                card.classList.add('expanded');
                document.getElementById('stepIntro').classList.add('hidden');
                
                const stepMain = document.getElementById('stepMain');
                stepMain.classList.remove('hidden');
                document.getElementById('welcomeHeading').innerText = `Hoş geldin, ${savedName} 👋`;
            } else {
                // İlk giriş: Alt kısımdan fırlayan animasyonlu kare kutu
                card.classList.add('anim-pop');
            }
        });

        function selectRadio(element, value) {
            document.querySelectorAll('.radio-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            metPoyrazValue = value;
        }

        function completeIntro() {
            const nameInput = document.getElementById('introName').value.trim();
            const introError = document.getElementById('introError');

            if (!nameInput) {
                introError.innerText = "Lütfen adını gir kanka.";
                return;
            }

            introError.innerText = "";

            // Bilgileri kaydet
            localStorage.setItem('visitor_name', nameInput);
            localStorage.setItem('met_poyraz', metPoyrazValue);
            localStorage.setItem('device_screen', `${window.screen.width}x${window.screen.height}`);

            const stepIntro = document.getElementById('stepIntro');
            const stepMain = document.getElementById('stepMain');
            const card = document.getElementById('mainCard');

            // 1. Yazılar Fade Out
            stepIntro.classList.add('fade-out');

            setTimeout(() => {
                // 2. Karşılama kutusu tamamen gizlenir
                stepIntro.classList.add('hidden');
                
                // 3. Kare kutu dikey ve yatay olarak yumuşakça esneyerek dikdörtgen profile dönüşür
                card.classList.add('expanded');

                // 4. Ana profil içeriği görünür yapılır ve fade-in olur
                stepMain.classList.remove('hidden');
                stepMain.classList.add('fade-in');
                document.getElementById('welcomeHeading').innerText = `Aramıza Katıldın, ${nameInput}`;
            }, 350);
        }

        async function sendMessage() {
            const messageInput = document.getElementById('userMessage').value.trim();
            const isAnon = document.getElementById('anonCheck').checked;
            const statusMsg = document.getElementById('statusMsg');

            if (!messageInput) {
                statusMsg.className = "status-msg status-error";
                statusMsg.innerText = "Bir mesaj yazmayı unuttun kanka.";
                return;
            }

            const savedName = localStorage.getItem('visitor_name') || "İsimsiz";
            const metInfo = localStorage.getItem('met_poyraz') || "Bilinmiyor";
            const screenInfo = localStorage.getItem('device_screen') || "Bilinmiyor";

            let senderName = isAnon ? "Anonim 🥷" : savedName;

            statusMsg.className = "status-msg";
            statusMsg.innerText = "Gönderiliyor...";

            const payload = {
                username: "Site Mesaj Botu",
                embeds: [{
                    title: "📩 Siteden Yeni Mesaj!",
                    color: isAnon ? 0x7289da : 0x2e5238,
                    fields: [
                        { name: "Gönderen", value: senderName, inline: true },
                        { name: "Poyraz ile Tanışıyor mu?", value: metInfo, inline: true },
                        { name: "Ekran Boyutu", value: screenInfo, inline: true },
                        { name: "Mesaj", value: messageInput }
                    ],
                    timestamp: new Date()
                }]
            };

            try {
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok || response.status === 204) {
                    statusMsg.className = "status-msg status-success";
                    statusMsg.innerText = "Mesajın iletildi kanka!";
                    document.getElementById('userMessage').value = "";
                } else {
                    throw new Error();
                }
            } catch (err) {
                statusMsg.className = "status-msg status-error";
                statusMsg.innerText = "Hata oluştu, gönderilemedi.";
            }
        }
    </script>
</body>
</html>
