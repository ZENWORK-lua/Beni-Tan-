<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Poyraz</title>
    
    <!-- Google Fonts: Inter (Apple tarzı temiz tipografi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0c140e;          /* Koyu Orman Yeşili Arka Plan */
            --card-bg: #142018;          /* Koyu Yeşil Kart Rengi */
            --card-border: #1e3024;      /* Yumuşak Yeşil Sınır Çizgisi */
            --text-cream: #f4efe6;       /* Premium Krem Yazı Rengi */
            --text-muted: #9ab0a0;       /* Pastel Yeşil/Gri Yardımcı Yazı */
            --accent-green: #2e5238;     /* Vurgu Yeşili */
            --accent-brown: #cfbda8;     /* Açık Kahve / Bej Vurgu */
            --accent-brown-hover: #b8a48f;
            --radius-app: 20px;
            
            /* Apple Tarzı İpeksi Geçiş Eğrisi */
            --apple-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-cream);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Derinlik veren yumuşak arka plan geçişi */
            background-image: radial-gradient(circle at 50% 0%, #15261b 0%, var(--bg-main) 70%);
            background-attachment: fixed;
        }

        .main-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-app);
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            animation: fadeIn 0.8s var(--apple-ease);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Profil Bölümü */
        .profile-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--accent-green);
            border: 2px solid var(--accent-brown);
            margin: 0 auto 14px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-cream);
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
        }

        .name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-cream);
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.45;
            margin-top: 8px;
        }

        /* Hobiler & Kimlik Etiketleri */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 14px;
        }

        .tag {
            background: rgba(207, 189, 168, 0.08);
            border: 1px solid rgba(207, 189, 168, 0.15);
            color: var(--accent-brown);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: var(--card-border);
            margin: 24px 0;
        }

        /* Mesaj Alanı Formu */
        .message-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .box-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-cream);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-field, .textarea-field {
            width: 100%;
            background: rgba(12, 20, 14, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text-cream);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.25s var(--apple-ease);
        }

        .input-field:focus, .textarea-field:focus {
            border-color: var(--accent-brown);
            background: rgba(12, 20, 14, 0.9);
            box-shadow: 0 0 0 3px rgba(207, 189, 168, 0.1);
        }

        .textarea-field {
            resize: none;
            height: 90px;
        }

        /* Anonim Seçenek Switch Alanı */
        .anon-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(12, 20, 14, 0.3);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(30, 48, 36, 0.5);
            cursor: pointer;
            user-select: none;
        }

        .anon-text {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Custom Switch (Apple Style) */
        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e3024;
            transition: .3s var(--apple-ease);
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-cream);
            transition: .3s var(--apple-ease);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-green);
            border: 1px solid var(--accent-brown);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
            background-color: var(--accent-brown);
        }

        /* Gönder Butonu */
        .send-btn {
            background: var(--accent-brown);
            color: var(--bg-main);
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--apple-ease);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .send-btn:hover {
            background: var(--accent-brown-hover);
            transform: translateY(-1px);
        }

        .send-btn:active {
            transform: scale(0.97);
        }

        /* Bildirim Durumu */
        .status-msg {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 6px;
            min-height: 18px;
            transition: all 0.3s var(--apple-ease);
        }

        .status-success { color: #81c784; }
        .status-error { color: #e57373; }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- Profil Bilgisi -->
        <div class="profile-section">
            <div class="avatar">AP</div>
            <h1 class="name">Ali Poyraz</h1>
            <p class="bio">Kod yazmak, kalisteniks, basketbol ve sistem optimizasyonları. Takılmaca.</p>

            <div class="tags-container">
                <span class="tag">Samsun</span>
                <span class="tag">Luau & Scripting</span>
                <span class="tag">Hot Wheels</span>
                <span class="tag">Linux</span>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Mesaj Bırakma Kutusu -->
        <div class="message-box">
            <div class="box-title">
                <span>Bir Mesaj Bırak</span>
            </div>

            <!-- Kullanıcı İsmi -->
            <input type="text" id="userName" class="input-field" placeholder="Adın ne? (Opsiyonel)" maxlength="30">

            <!-- Mesaj Metni -->
            <textarea id="userMessage" class="textarea-field" placeholder="Düşüncelerini veya söylemek istediğini yaz..." maxlength="500"></textarea>

            <!-- İsmimi Gizle Switch -->
            <label class="anon-option">
                <span class="anon-text">İsmim gizlensin (Anonim Gönder)</span>
                <div class="switch">
                    <input type="checkbox" id="anonCheck">
                    <span class="slider"></span>
                </div>
            </label>

            <!-- Anında Gönder Butonu -->
            <button class="send-btn" onclick="sendMessage()">
                <span>Mesajı Gönder</span>
            </button>

            <div id="statusMsg" class="status-msg"></div>
        </div>
    </div>

    <script>
        // BURAYA KENDİ DISCORD WEBHOOK URL'Nİ YAPIŞTIRACAKSIN
        const DISCORD_WEBHOOK_URL = "BURAYA_DISCORD_WEBHOOK_LINKINI_YAPISTIR";

        async function sendMessage() {
            const nameInput = document.getElementById('userName').value.trim();
            const messageInput = document.getElementById('userMessage').value.trim();
            const isAnon = document.getElementById('anonCheck').checked;
            const statusMsg = document.getElementById('statusMsg');

            if (!messageInput) {
                statusMsg.className = "status-msg status-error";
                statusMsg.innerText = "Lütfen önce bir mesaj yaz kanka.";
                return;
            }

            // İsim mantığı: İsim gizlensin seçiliyse 'Anonim', değilse girilen isim (boşsa 'İsimsiz')
            let senderName = "İsimsiz";
            if (isAnon) {
                senderName = "Anonim 🥷";
            } else if (nameInput !== "") {
                senderName = nameInput;
            }

            statusMsg.className = "status-msg";
            statusMsg.innerText = "İletiliyor...";

            const payload = {
                username: "Site Mesaj Botu",
                embeds: [{
                    title: "📩 Siteden Yeni Mesaj Var!",
                    color: isAnon ? 0x7289da : 0x2e5238,
                    fields: [
                        { name: "Gönderen", value: senderName, inline: true },
                        { name: "Mesaj", value: messageInput }
                    ],
                    timestamp: new Date()
                }]
            };

            try {
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok || response.status === 204) {
                    statusMsg.className = "status-msg status-success";
                    statusMsg.innerText = "Mesajın anında iletildi kanka, eyvallah!";
                    document.getElementById('userMessage').value = "";
                } else {
                    throw new Error();
                }
            } catch (err) {
                statusMsg.className = "status-msg status-error";
                statusMsg.innerText = "Bir hata oluştu, mesaj gitmedi.";
            }
        }
    </script>
</body>
</html>
